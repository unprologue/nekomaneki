<!doctype html>
<html lang="ja">

  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="index.html" aria-label="NEKOMANEKI home">
          <img
            class="brand-mark"
            src="logo-nekomaneki.png"
            alt="NEKOMANEKI"
            width="912"
            height="148"
          />
        </a>
        <nav class="primary-nav" aria-label="メインナビゲーション">
          <a href="index.html#about">ABOUT</a>
          <a href="index.html#product">PRODUCT</a>
          <a href="index.html#size">SIZE</a>
          <a href="index.html#story">STORY</a>
          <a href="index.html#news">NEWS</a>
        </nav>
        <div class="header-actions">
          <a href="account.html" class="icon-btn">
            <span class="visually-hidden">アカウント</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M5.5 19.2c1.6-3.2 4-4.8 6.5-4.8s4.9 1.6 6.5 4.8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>

    <main class="page-main page-main--wide">

        <h1>YUMENEKO</h1>
        <p class="lede">サイズを選んで、願いをかたちに。</p>

    <section class="size size--page" aria-label="Size options">
      <div class="size-grid">
        <article class="size-card size-card--left">
          <div class="size-card-media">
            <img src="size-yumeneko-s.jpg" alt="YUMENEKO Sサイズ" width="1122" height="1402" />
          </div>
          <p class="size-card-price">¥6,900</p>
          <p class="size-card-desc">S SIZE · H 10CM · DESK & GIFT</p>
          <span class="size-card-cta">

            <span class="size-card-cta-icon" aria-hidden="true"></span>
          </span>

        <article class="size-card size-card--center">
          <div class="size-card-media">
            <img src="size-yumeneko-m.jpg" alt="YUMENEKO Mサイズ" width="1122" height="1402" />
          </div>
          <p class="size-card-price">¥11,000</p>
          <p class="size-card-desc">M SIZE · H 18CM · SHELF & ENTRY</p>
          <span class="size-card-cta">
            Coming soon
            <span class="size-card-cta-icon" aria-hidden="true"></span>
          </span>

        <article class="size-card size-card--right">
          <div class="size-card-media">
            <img src="size-yumeneko-l.jpg" alt="YUMENEKO Lサイズ" width="1122" height="1402" />
          </div>
          <p class="size-card-price">¥22,000</p>
          <p class="size-card-desc">L SIZE · H 24CM · STATEMENT PIECE</p>
          <span class="size-card-cta">

            <span class="size-card-cta-icon" aria-hidden="true"></span>
          </span>

      </div>

    <footer class="site-footer">
      <p class="copyright">© <span data-year></span> NEKOMANEKI</p>
    </footer>
    <script src="script.js"></script>
