<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CONTACT | NEKOMANEKI</title>
    <meta name="description" content="Contact NEKOMANEKI." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500&family=Shippori+Mincho:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="index.html" aria-label="NEKOMANEKI home">
          <img
            class="brand-mark"
            src="logo-nekomaneki.png"
            alt="NEKOMANEKI"
            width="912"
            height="148"
          />
        </a>
        <nav class="primary-nav" aria-label="メインナビゲーション">
          <a href="index.html#about">ABOUT</a>
          <a href="index.html#product">PRODUCT</a>
          <a href="index.html#size">SIZE</a>
          <a href="index.html#story">STORY</a>
          <a href="index.html#news">NEWS</a>
        </nav>
        <div class="header-actions">
          <a href="account.html" class="icon-btn">
            <span class="visually-hidden">アカウント</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M5.5 19.2c1.6-3.2 4-4.8 6.5-4.8s4.9 1.6 6.5 4.8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          </a>
          <button type="button" class="menu-toggle" aria-label="メニューを開く" aria-expanded="false"><span></span><span></span></button>
        </div>
      </div>
    </header>

    <main class="page-main">
      <section class="page-hero">
        <p class="kicker">SUPPORT</p>
        <h1>CONTACT</h1>
        <p class="lede">ご質問・取材・取り扱いに関するお問い合わせはこちらから。</p>
      </section>

      <form class="form-grid" action="#" method="post">
        <label class="field">NAME<input type="text" name="name" autocomplete="name" /></label>
        <label class="field">EMAIL<input type="email" name="email" autocomplete="email" /></label>
        <label class="field">MESSAGE<textarea name="message"></textarea></label>
        <button class="button" type="submit">SEND</button>
      </form>
    </main>

    <footer class="site-footer">
      <p class="copyright">© <span data-year></span> NEKOMANEKI</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
